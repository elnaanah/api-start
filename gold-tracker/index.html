<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة الذهب</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 24px 12px;
    }

    body > div {
      max-width: 360px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
    }

    label {
      display: block;
      margin: 12px 0 5px;
    }

    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      font-size: 16px;
    }

    #prices, #result {
      margin: 16px 0;
      padding: 12px;
      background: #f8f3e8;
      border-radius: 6px;
    }

    #prices p {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0;
    }

    button {
      margin-top: 16px;
      border: 0;
      border-radius: 5px;
      background: #9a6700;
      color: white;
      cursor: pointer;
    }

    #result {
      text-align: center;
      font-weight: bold;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <div>
    <h1>حاسبة أسعار الذهب</h1>

    <div id="prices">
      <p><span>سعر الأونصة:</span><strong id="ounce">جاري التحميل...</strong></p>
      <p><span>غرام عيار 24:</span><strong id="g24">-</strong></p>
      <p><span>غرام عيار 21:</span><strong id="g21">-</strong></p>
    </div>

    <label for="grams">عدد الغرامات:</label>
    <input type="number" id="grams" value="1" min="1">

    <label for="karat">العيار:</label>
    <select id="karat">
      <option value="21" selected>عيار 21</option>
      <option value="24">عيار 24</option>
    </select>

    <button id="calc-btn">احسب بالدولار</button>

    <div>القيمة الإجمالية:</div>
    <div id="result">$0.00</div>
  </div>

  <script src="app.js"></script>
</body>
</html>
