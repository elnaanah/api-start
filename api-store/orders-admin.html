<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استقبال الطلبات — متجر نهضة تقنية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans Arabic"', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans min-h-screen flex flex-col">

  <!-- شريط علوي موحد -->
  <header class="sticky top-0 z-40 bg-white border-b border-zinc-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
      <a href="index.html" class="text-base font-bold text-zinc-900 shrink-0">متجر نهضة تقنية</a>

      <nav class="flex items-center gap-1 overflow-x-auto text-xs sm:text-sm font-medium py-1">
        <a href="index.html" class="px-3 py-1.5 rounded-lg text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 transition-colors shrink-0">المنتجات</a>
        <a href="orders.html" class="px-3 py-1.5 rounded-lg text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 transition-colors shrink-0">طلباتي</a>
        <a href="products.html" class="px-3 py-1.5 rounded-lg text-zinc-600 hover:text-zinc-900 hover:bg-zinc-100 transition-colors shrink-0">إدارة المنتجات</a>
        <a href="orders-admin.html" class="px-3 py-1.5 rounded-lg bg-zinc-900 text-white font-semibold shrink-0">لوحة الطلبات</a>
      </nav>

      <button
        onclick="fetchOrders()"
        class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-semibold bg-zinc-100 hover:bg-zinc-200 text-zinc-800 transition-colors shrink-0"
        title="تحديث فوري الآن"
      >
        تحديث
      </button>
    </div>
  </header>

  <!-- المحتوى الرئيسي -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-4">

    <!-- شريط الإحصائيات (العدد وآخر طالب) -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white border border-zinc-200 rounded-xl p-3.5">
        <span class="text-[11px] font-medium text-zinc-500 block">إجمالي الطلبات المستلمة</span>
        <span id="stat-count" class="text-2xl font-bold text-zinc-900">0</span>
      </div>

      <div class="bg-white border border-zinc-200 rounded-xl p-3.5 truncate">
        <span class="text-[11px] font-medium text-zinc-500 block">آخر طلب وصل</span>
        <span id="stat-last" class="text-base font-bold text-zinc-900 truncate block mt-0.5">—</span>
      </div>
    </div>

    <!-- شريط الحالة والمعلومات -->
    <div class="flex items-center justify-between text-xs text-zinc-500 px-1">
      <div class="flex items-center gap-2">
        <span class="font-bold text-zinc-800">سجل الطلبات الواردة</span>
        <span class="text-zinc-300">•</span>
        <code class="font-mono text-[11px] text-zinc-500">GET /api/orders</code>
      </div>
      <span id="last-update" class="font-mono text-[11px]">آخر فحص: —</span>
    </div>

    <!-- شبكة الطلبات الحية (3 في السطر بالشاشات الكبيرة) -->
    <div id="feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

  </main>

  <footer class="mt-auto border-t border-zinc-200 bg-white py-3 text-center text-xs text-zinc-500">
    متجر نهضة تقنية — لوحة استقبال ومتابعة الطلبات عبر REST API
  </footer>

  <!-- إشعار Toast -->
  <div
    id="toast"
    class="fixed top-6 left-1/2 -translate-x-1/2 opacity-0 pointer-events-none transition-opacity duration-200 z-50 px-4 py-2 rounded-full text-xs font-semibold text-white bg-zinc-900 shadow-lg"
  ></div>

  <script src="js/api.js"></script>
  <script>
    const API_ORDERS = typeof API_URL !== "undefined" ? `${API_URL}/orders` : "https://souk-albab.vercel.app/api/orders";

    let _prevSnapshot = "";
    let _toastTimer;

    function showToast(msg, isError = false) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = msg;
      el.className = `fixed top-6 left-1/2 -translate-x-1/2 transition-opacity duration-200 z-50 px-4 py-2 rounded-full text-xs font-semibold text-white shadow-lg opacity-100 ${
        isError ? "bg-red-600" : "bg-zinc-900"
      }`;
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => {
        el.className =
          "fixed top-6 left-1/2 -translate-x-1/2 opacity-0 pointer-events-none transition-opacity duration-200 z-50 px-4 py-2 rounded-full text-xs font-semibold text-white bg-zinc-900 shadow-lg";
      }, 2500);
    }

    function getStatusBadge(status) {
      const s = status || "قيد التجهيز";
      switch (s) {
        case "تم التسليم":
          return {
            badge: "bg-emerald-50 text-emerald-700 border-emerald-200/80",
            label: "تم التسليم",
          };
        case "تم الشحن":
          return {
            badge: "bg-blue-50 text-blue-700 border-blue-200/80",
            label: "تم الشحن",
          };
        case "ملغي":
          return {
            badge: "bg-red-50 text-red-700 border-red-200/80",
            label: "ملغي",
          };
        default:
          return {
            badge: "bg-amber-50 text-amber-700 border-amber-200/80",
            label: "قيد التجهيز",
          };
      }
    }

    async function setStatus(orderId, newStatus) {
      try {
        const res = await updateOrderStatus(orderId, newStatus);
        if (res.success) {
          showToast(`تم تغيير حالة الطلب إلى "${newStatus}"`);
          _prevSnapshot = "";
          await fetchOrders();
        } else {
          showToast(res.message || "فشل تغيير حالة الطلب", true);
        }
      } catch (err) {
        showToast("تعذر الاتصال بالسيرفر لتعديل الحالة", true);
      }
    }

    async function fetchOrders() {
      const feed = document.getElementById("feed");
      try {
        const res = await fetch(API_ORDERS);
        const result = await res.json();

        const el = document.getElementById("last-update");
        if (el) el.textContent = "آخر فحص: " + new Date().toLocaleTimeString("ar-EG");

        if (result.success) {
          renderFeed(result.data);
        }
      } catch (err) {
        if (feed) {
          feed.innerHTML = `
            <div class="col-span-full bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-center text-xs">
              تعذر الاتصال بالسيرفر على <code>${API_ORDERS}</code> — تأكد من تشغيل مشروع Next.js.
            </div>
          `;
        }
      }
    }

    function renderFeed(orders) {
      const statCount = document.getElementById("stat-count");
      if (statCount) statCount.textContent = orders.length;

      const lastOrder = orders[orders.length - 1];
      const statLast = document.getElementById("stat-last");
      if (statLast) {
        statLast.textContent = lastOrder ? lastOrder.customerName : "بانتظار أول طالب...";
      }

      const snapshot = JSON.stringify(
        orders.map((o) => [o.id, o.status, o.address, o.customerPhone])
      );
      if (snapshot === _prevSnapshot) return;
      _prevSnapshot = snapshot;

      const feed = document.getElementById("feed");
      if (!feed) return;

      if (!orders.length) {
        feed.innerHTML = `
          <div class="col-span-full bg-white border border-dashed border-zinc-200 rounded-xl p-12 text-center">
            <span class="text-3xl block mb-2">📭</span>
            <p class="text-sm font-semibold text-zinc-700">لا توجد طلبات واردة بعد</p>
            <p class="text-xs text-zinc-400 mt-1">بمجرد إرسال طلب عبر POST /api/orders سيظهر هنا تلقائياً.</p>
          </div>
        `;
        return;
      }

      const reversed = [...orders].reverse();
      const statuses = ["قيد التجهيز", "تم الشحن", "تم التسليم", "ملغي"];

      feed.innerHTML = reversed
        .map((o, index) => {
          const isNewest = index === 0;
          const time = new Date(o.createdAt).toLocaleTimeString("ar-EG");
          const currentStatus = o.status || "قيد التجهيز";
          const badgeInfo = getStatusBadge(currentStatus);

          return `
            <div class="bg-white border ${
              isNewest ? "border-emerald-500/80 ring-2 ring-emerald-500/10" : "border-zinc-200"
            } rounded-xl p-4 sm:p-5 hover:border-zinc-300 transition-all shadow-sm flex flex-col justify-between">
              <div class="space-y-3">
                <div class="flex items-center justify-between gap-2 pb-2.5 border-b border-zinc-100">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="font-mono text-xs font-bold text-zinc-700 bg-zinc-100 px-2 py-0.5 rounded">
                      #${o.orderId}
                    </span>
                    <span class="text-[11px] font-bold border px-2 py-0.5 rounded-full ${badgeInfo.badge}">
                      ${badgeInfo.label}
                    </span>
                    ${
                      isNewest
                        ? `
                      <span class="inline-flex items-center gap-1 text-[10px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200/80 px-1.5 py-0.5 rounded-full">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        جديد
                      </span>
                    `
                        : ""
                    }
                  </div>

                  <span class="text-zinc-400 font-mono text-[11px] shrink-0">${time}</span>
                </div>

                <div class="flex items-start justify-between gap-2">
                  <div class="min-w-0">
                    <h3 class="text-sm sm:text-base font-bold text-zinc-900 truncate">${o.customerName}</h3>
                    <p class="text-xs text-zinc-500 font-mono flex items-center gap-1 mt-0.5 truncate">
                      📞 ${o.customerPhone}
                    </p>
                    <p class="text-xs text-zinc-500 flex items-center gap-1 mt-0.5 truncate" title="${o.address}">
                      📍 ${o.address}
                    </p>
                  </div>

                  <div class="text-end shrink-0">
                    <span class="text-[10px] text-zinc-400 block font-medium">الإجمالي</span>
                    <span class="text-lg font-bold text-zinc-900 font-mono">$${o.totalAmount}</span>
                  </div>
                </div>
              </div>

              <div class="mt-3 pt-3 border-t border-zinc-100 space-y-3">
                <div class="divide-y divide-zinc-100 rounded-lg bg-zinc-50 border border-zinc-100 overflow-hidden text-xs">
                  ${o.items
                    .map(
                      (item) => `
                    <div class="flex items-center justify-between px-2.5 py-1.5">
                      <span class="font-medium text-zinc-800 truncate text-[11px]">${item.title}</span>
                      <div class="flex items-center gap-2 shrink-0 ms-2 font-mono text-[11px]">
                        <span class="text-zinc-400">×${item.quantity}</span>
                        <strong class="text-zinc-900 font-semibold">$${(
                          item.quantity * item.price
                        ).toFixed(2)}</strong>
                      </div>
                    </div>
                  `
                    )
                    .join("")}
                </div>

                <div class="pt-2 border-t border-zinc-100">
                  <span class="text-[10px] font-semibold text-zinc-400 block mb-1.5">تحديث الحالة:</span>
                  <div class="grid grid-cols-4 gap-1">
                    ${statuses
                      .map((st) => {
                        const isActive = currentStatus === st;
                        let activeClass = "";
                        if (isActive) {
                          if (st === "تم التسليم") activeClass = "bg-emerald-600 text-white font-bold shadow-sm";
                          else if (st === "تم الشحن") activeClass = "bg-blue-600 text-white font-bold shadow-sm";
                          else if (st === "ملغي") activeClass = "bg-red-600 text-white font-bold shadow-sm";
                          else activeClass = "bg-amber-600 text-white font-bold shadow-sm";
                        } else {
                          activeClass = "bg-zinc-100 hover:bg-zinc-200 text-zinc-600";
                        }

                        return `
                          <button
                            onclick="setStatus('${o.id}', '${st}')"
                            class="px-1.5 py-1 text-[10px] sm:text-[11px] rounded transition-colors text-center truncate ${activeClass}"
                            title="تغيير إلى ${st}"
                          >
                            ${st}
                          </button>
                        `;
                      })
                      .join("")}
                  </div>
                </div>
              </div>
            </div>
          `;
        })
        .join("");
    }

    fetchOrders();
    setInterval(fetchOrders, 3000);
  </script>
</body>
</html>
